# Messages de SHShopGuiTop, codes couleur &. Un message vide ("") n'est pas envoyé.
#
# Placeholders :
#   {commands}   sous-commandes de /shshopguitop que l'expéditeur peut utiliser (usage)
#   {file}       fichier illisible (reload-failed)
#   {error}      erreur de lecture du fichier (reload-failed)
#   {amount} {item} {revenue}   vente enregistrée (record-done-hand)
#   {item}       article enregistré (record-done-item)
#   {count}      nombre d'articles affichés (top-header)
#   {rank} {item} {id} {sold} {revenue}   ligne du classement (top-line) : nom traduit, nom interne dans ShopGUI+,
#                exemplaires vendus, revenu total exact

