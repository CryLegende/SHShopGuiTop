name: SHShopGuiTop
version: '${project.version}'
main: org.Cry_Legende.sHShopGuiTop.SHShopGuiTop
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI, ShopGUIPlus]

commands:
  recordsale:
    description: Enregistre une vente pour tester le top des items.
    usage: /recordsale <amount>
    permission: shshopguitop.recordsale

permissions:
  shshopguitop.recordsale:
    description: Enregistre une vente à la main (test). Sans cela, n'importe quel joueur gonflait le classement.
    default: op
