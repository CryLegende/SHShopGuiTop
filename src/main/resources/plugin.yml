name: SHShopGuiTop
version: '${project.version}'
main: org.Cry_Legende.sHShopGuiTop.SHShopGuiTop
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI, ShopGUIPlus]
# SHNetwork est facultatif : sans lui, les ventes restent dans sales.yml de ce serveur.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (ventes en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  recordsale:
    description: Enregistre une vente pour tester le top des items.
    usage: /recordsale <amount>
    permission: shshopguitop.recordsale

permissions:
  shshopguitop.recordsale:
    description: Enregistre une vente à la main (test). Sans cela, n'importe quel joueur gonflait le classement.
    default: op
