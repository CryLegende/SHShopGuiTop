name: SHShopGuiTop
version: '${project.version}'
main: org.Cry_Legende.sHShopGuiTop.SHShopGuiTop
api-version: '1.20'
author: Cry_Legende
depend: [PlaceholderAPI, ShopGUIPlus]
# SHNetwork est facultatif : sans lui, les ventes restent dans sales.yml de ce serveur.
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (ventes en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shshopguitop:
    description: Administration de SHShopGuiTop.
    usage: /<command> <record|top|reload>
  recordsale:
    description: Ancienne commande, identique à /shshopguitop record.
    usage: /<command> <quantité> | /<command> <article> <quantité> <revenu>
    permission: shshopguitop.admin.record

permissions:
  shshopguitop.admin:
    description: Toutes les sous-commandes de /shshopguitop.
    default: op
    children:
      shshopguitop.admin.reload: true
      shshopguitop.admin.record: true
      shshopguitop.admin.top: true
  shshopguitop.admin.reload:
    description: /shshopguitop reload, recharge config.yml et messages.yml.
    default: op
  shshopguitop.admin.record:
    description: /shshopguitop record, enregistre une vente à la main (test). Sans cela, n'importe quel joueur gonflait le classement.
    default: op
  shshopguitop.admin.top:
    description: /shshopguitop top, affiche le classement avec les valeurs exactes.
    default: op
