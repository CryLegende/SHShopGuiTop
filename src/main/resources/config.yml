# SHShopGuiTop : classement des articles les plus vendus au shop ShopGUI+, en placeholders PlaceholderAPI.
# Chaque vente réelle (ShopGUI+ SELL et SELL_ALL, hors transactions annulées) s'ajoute au total de son article.
#
# Placeholders :
#   %shshopguitop_top1% ... %shshopguitop_top10%    ligne du classement, mise en forme par placeholder.format.
#
# Commandes :
#   /shshopguitop record <quantité>                      Enregistre une vente de l'objet de shop en main (test).
#   /shshopguitop record <article> <quantité> <revenu>   Idem pour un article nommé, depuis la console.
#   /shshopguitop top                                    Affiche le classement avec les quantités et revenus exacts.
#   /shshopguitop reload                                 Recharge config.yml et messages.yml, sans toucher aux ventes
#                                                        (la section reseau demande un redémarrage).
#   /recordsale ...                                      Ancienne commande, identique à record.
#
# Permissions (op par défaut) :
#   shshopguitop.admin           Toutes les sous-commandes de /shshopguitop.
#   shshopguitop.admin.record    record et /recordsale.
#   shshopguitop.admin.top       top.
#   shshopguitop.admin.reload    reload.
#
# Les textes sont dans messages.yml.
#
# Les ventes sont gardées dans sales.yml, écrit toutes les 5 minutes et à l'arrêt.

placeholder:
  # Jetons : {index} rang, {item} nom de l'article, {sold} exemplaires vendus, {revenue} revenu total
  format: "&e{index} &7• &e{item}&7, &e{sold} &7vendus (&e{revenue} SHC&7)"
display:
  useRealName: true

# Avec SHNetwork, les ventes de tous les serveurs s'additionnent dans la base commune (table shshopguitop_sales,
# ajout atomique sold = sold + ?) et sales.yml n'est plus écrit. Si la base est encore vide au démarrage, les ventes
# de sales.yml y sont reprises une fois. Sans SHNetwork, ou à false, sales.yml reste la référence de ce serveur.
# Toute cette section se lit au démarrage : la modifier demande un redémarrage.
reseau:
  actif: true
  # Délai entre deux écritures des ventes en base, en secondes
  ecriture-secondes: 10
  # Délai entre deux relectures du classement en base, en secondes : les placeholders affichent cette copie
  rafraichissement-secondes: 60
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: CHANGE_ME
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000
